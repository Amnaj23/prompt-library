<style>
/* Layout: sticky top bar (search + add) over category tabs, then a masonry wall of prompt cards; detail and form open as centered sheets. */
:root {
  --bg: #0d0e11;
  --surface: #16171c;
  --surface-2: #1e2026;
  --line: #2a2d35;
  --fg: #eceef2;
  --muted: #8d919c;
  --accent: #ff8a3d;
  --accent-ink: #1a0e05;
  --danger: #ff6b6b;
  --scrim: rgba(5, 6, 8, 0.72);
  --font-display: "Prompt", "Anuphan", system-ui, sans-serif;
  --font-body: "Anuphan", "Noto Sans Thai", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f4f6; --surface: #ffffff; --surface-2: #ecedf1; --line: #dcdee4;
    --fg: #16171c; --muted: #6b6f7a; --accent: #e0661a; --accent-ink: #ffffff;
    --danger: #d23a3a; --scrim: rgba(20, 22, 28, 0.55); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f4f6; --surface: #ffffff; --surface-2: #ecedf1; --line: #dcdee4;
  --fg: #16171c; --muted: #6b6f7a; --accent: #e0661a; --accent-ink: #ffffff;
  --danger: #d23a3a; --scrim: rgba(20, 22, 28, 0.55); color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1440px; margin: 0 auto; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 18px 12px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); }
.spacer { flex: 1 1 0; }
.search { flex: 1 1 260px; max-width: 420px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; }
.search:focus { border-color: var(--accent); outline: none; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 500; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn:disabled { opacity: .55; cursor: default; }

.tabs { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; align-items: center; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 16px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--fg); border-color: var(--muted); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab .n { font-family: var(--font-mono); font-size: 12px; opacity: .7; }
.tab.add { border-style: dashed; }
.catform { display: inline-flex; gap: 6px; flex: 0 0 auto; }
.catform input { background: var(--surface); border: 1px solid var(--accent); border-radius: 999px; padding: 6px 14px; width: 170px; min-width: 0; }
.catform input:focus { outline: none; }

/* masonry wall */
.wall { columns: 4 250px; column-gap: 16px; padding-top: 22px; }
.card { break-inside: avoid; margin: 0 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; display: block; width: 100%; text-align: left; padding: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--muted); transform: translateY(-2px); }
.media { position: relative; background: var(--surface-2); }
.media img, .media video { display: block; width: 100%; height: auto; }
.ph { aspect-ratio: 4 / 5; display: flex; align-items: flex-end; padding: 16px; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.25; color: #f4f4f6; text-wrap: balance; }
.badge { position: absolute; left: 10px; top: 10px; background: rgba(8, 9, 12, .72); color: #f4f4f6; font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 6px; }
.fabs { position: absolute; right: 10px; bottom: 10px; left: 10px; display: flex; justify-content: flex-end; gap: 6px; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
.card:hover .fabs, .fabs:focus-within { opacity: 1; transform: none; }
@media (hover: none) { .fabs { opacity: 1; transform: none; } }
.copy-fab { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.gpt-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; }
.gpt-btn:hover { filter: brightness(1.12); }

.actions .gpt-btn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--fg); font-size: 15px; }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.ctitle { font-weight: 600; font-size: 15px; margin: 0; }
.cprompt { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.chip.tool { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

.empty { padding: 72px 0; text-align: center; color: var(--muted); max-width: 440px; margin: 0 auto; }
.empty h2 { font-family: var(--font-display); color: var(--fg); font-size: 20px; margin: 0 0 8px; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 980px; margin: auto 0; overflow: hidden; }
.sheet.narrow { max-width: 600px; }
.detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.detail .dmedia { background: var(--surface-2); display: flex; align-items: center; justify-content: center; min-width: 0; }
.detail .dmedia img, .detail .dmedia video { display: block; width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
.detail .dmedia .ph { width: 100%; }
.dinfo { padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.dinfo h2 { font-family: var(--font-display); font-size: 22px; line-height: 1.25; margin: 0; text-wrap: balance; }
.promptbox { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-family: var(--font-mono); font-size: 13px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 44vh; overflow-y: auto; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.close { margin-left: auto; background: transparent; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 8px; }
.close:hover { color: var(--fg); }
.dhead { display: flex; align-items: center; gap: 8px; }
@media (max-width: 760px) { .detail { grid-template-columns: minmax(0, 1fr); } .detail .dmedia img, .detail .dmedia video { max-height: 56vh; } }

.form { padding: 22px; display: grid; gap: 14px; }
.form h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input[type="text"], .field input[type="url"], .field textarea, .field select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.field textarea { min-height: 150px; resize: vertical; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.drop { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--bg); }
.drop .prev { max-height: 180px; border-radius: 8px; overflow: hidden; display: none; }
.drop .prev.on { display: block; }
.drop .prev img, .drop .prev video { display: block; max-height: 180px; width: auto; max-width: 100%; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.err { color: var(--danger); font-size: 13px; margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 18px; border-radius: 999px; font-weight: 500; z-index: 60; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  function resizeToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var tries = [[1000, 0.82], [800, 0.72], [640, 0.62], [480, 0.55]], out = "";
        for (var t = 0; t < tries.length; t++) {
          var sc = Math.min(1, tries[t][0] / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
          var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", tries[t][1]);
          if (out.length < 700000) break;
        }
        URL.revokeObjectURL(url); resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject({ code: "bad_image" }); };
      img.src = url;
    });
  }

    mountSheet('<form class="form" id="authForm"><div class="dhead"><h2>' + (had ? "เปลี่ยนรหัสแอดมิน" : "ตั้งรหัสแอดมิน") + '</h2><button class="close" type="button" id="aClose" aria-label="ปิด">×</button></div>' +
      '<p class="hint">ตั้งอีเมลและรหัสผ่านสำหรับเข้าโหมดแอดมิน หลังตั้งแล้วต้องกด "ส่งออกไฟล์เว็บ" และอัปไฟล์ขึ้นเว็บอีกครั้ง รหัสจึงมีผลกับเว็บจริง</p>' +
      '<div class="field"><label for="aEmail">อีเมลแอดมิน</label><input id="aEmail" type="email" autocomplete="username" required></div>' +
      '<div class="field"><label for="aPw">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input id="aPw" type="password" autocomplete="new-password" minlength="8" required></div>' +
      '<div class="field"><label for="aPw2">ยืนยันรหัสผ่าน</label><input id="aPw2" type="password" autocomplete="new-password" required></div>' +
      '<p class="err" id="aErr" hidden></p><div class="actions"><button class="btn primary" type="submit" id="aSave">บันทึก</button><button class="btn" type="button" id="aCancel">ยกเลิก</button></div></form>', true);
    $("aClose").addEventListener("click", closeSheet); $("aCancel").addEventListener("click", closeSheet);
    $("aEmail").focus();
    $("authForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var err = $("aErr"); err.hidden = true;
      function bad(m) { err.textContent = m; err.hidden = false; $("aSave").disabled = false; $("aSave").textContent = "บันทึก"; }
      var em = $("aEmail").value.trim().toLowerCase(), pw = $("aPw").value;
      if (pw.length < 8) { bad("รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร"); return; }
      if (pw !== $("aPw2").value) { bad("รหัสผ่านสองช่องไม่ตรงกัน"); return; }
      if (!hasCrypto()) { bad("เบราว์เซอร์นี้ตั้งรหัสไม่ได้ ให้เปิดผ่านลิงก์ https"); return; }
      $("aSave").disabled = true; $("aSave").textContent = "กำลังบันทึก";
      var salt = crypto.getRandomValues(new Uint8Array(16));
      deriveHash(em, pw, salt).then(function (h) {
        try { localStorage.setItem(LS_AUTH, JSON.stringify({ email: em, salt: b64(salt), hash: h })); } catch (x) { bad("บันทึกในเบราว์เซอร์ไม่ได้"); return; }
        markOk(); closeSheet(); enterAdmin(); toast("ตั้งรหัสแอดมินแล้ว กดส่งออกไฟล์เว็บเพื่อให้มีผลบนเว็บจริง");
      }, function () { bad("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง"); });
    });
  }

  function initLocal() {
    local = true; dbx = null; assets = null;
    var wantAdmin = !SITE_DATA || /^#admin$/.test(location.hash);
    if (!wantAdmin) { viewerMode(); return; }
    var auth = getAuth();
    if (auth && !sessionOk()) { renderWall(); showLogin(auth); return; }
    enterAdmin();
  }

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = function () { rej(new Error("load failed")); };
      document.head.appendChild(el);
    });
  }
  function onAuth(user) {
    var ok = !!(user && user.email && user.emailVerified && user.email.toLowerCase() === ADMIN_EMAIL);
    if (user && !ok) { toast("บัญชีนี้ไม่มีสิทธิ์แอดมิน"); fbAuth.signOut(); return; }
    state.admin = ok; state.canWrite = ok;
    $("addBtn").hidden = !ok; $("loginBtn").hidden = ok; $("logoutBtn").hidden = !ok;
    renderTabs(); renderWall();
  }
  function initFirebase() {
    var base = "https://www.gstatic.com/firebasejs/10.12.5/";
    loadScript(base + "firebase-app-compat.js").then(function () { return loadScript(base + "firebase-auth-compat.js"); })
      .then(function () { return loadScript(base + "firebase-firestore-compat.js"); })
      .then(function () {
        fbMode = true; local = false;
        firebase.initializeApp(FIREBASE_CONFIG); fbAuth = firebase.auth(); fbDb = firebase.firestore();
        state.canWrite = false; state.admin = false; $("loginBtn").hidden = false;
        fbDb.collection("prompts").onSnapshot(function (snap) {
          state.prompts = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; }); sortPrompts();
          state.loaded = true; state.error = false; renderTabs(); renderWall();
        }, function () { state.loaded = true; state.error = true; renderWall(); });
        fbDb.collection("categories").onSnapshot(function (snap) {
          state.cats = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
          renderTabs(); renderWall();
        }, function () {});
        fbAuth.onAuthStateChanged(onAuth);
        if (fbAuth.getRedirectResult) fbAuth.getRedirectResult().catch(function () {});
      }).catch(function () { initLocal(); });
  }
  function fbLogin() {
    if (!fbAuth) return;
    var pr = new firebase.auth.GoogleAuthProvider(); pr.setCustomParameters({ login_hint: ADMIN_EMAIL, prompt: "select_account" });
    fbAuth.signInWithPopup(pr).catch(function (e) {
      var c = e && e.code;
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") fbAuth.signInWithRedirect(pr);
      else if (c === "auth/unauthorized-domain") toast("โดเมนนี้ยังไม่ได้เพิ่มใน Authorized domains ของ Firebase");
      else if (c !== "auth/popup-closed-by-user" && c !== "auth/cancelled-popup-request") toast("เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง");
    });
  }

  function start() {
    if (!window.claude || !window.claude.use) { if (FIREBASE_CONFIG) initFirebase(); else initLocal(); return; }
    Promise.all([window.claude.use("db"), window.claude.use("assets"), window.claude.use("user")]).then(function (r) {
      dbx = r[0]; assets = r[1]; userCap = r[2];
      if (!dbx) { initLocal(); return; }
      var cw = userCap && userCap.can ? userCap.can("data.write") : null;
      var done = function (v) { state.canWrite = v !== false; $("addBtn").hidden = !state.canWrite; renderTabs(); renderWall(); };
      Promise.resolve(cw).then(done, function () { done(null); });
      dbx.collection("prompts").onSnapshot(function (snap) {
        state.prompts = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; }).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
        state.loaded = true; renderTabs(); renderWall();
      }, function () { state.loaded = true; renderWall(); });
      dbx.collection("categories").onSnapshot(function (snap) {
        state.cats = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
        renderTabs(); renderWall();
      }, function () {});
    });
  }
  start();
})();
</script>

</body>
</html>
